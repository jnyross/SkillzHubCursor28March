services:
  postgres:
    image: postgres:16-alpine
    container_name: skill-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill_builder
      POSTGRES_USER: skill_builder
      POSTGRES_PASSWORD: skill_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_builder -d skill_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: skill-builder-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    container_name: skill-builder-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/skill-builder-artifacts
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
